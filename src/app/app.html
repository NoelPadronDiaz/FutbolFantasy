<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">⚽ Fantasy Tracker</span>
    @if (auth.user(); as user) {
      <nav>
        <a routerLink="/plantilla" routerLinkActive="active">Plantilla</a>
        <a routerLink="/historico" routerLinkActive="active">Histórico</a>
        <a routerLink="/balance" routerLinkActive="active">Balance</a>
      </nav>
      <div class="user-menu">
        <span class="user-email">{{ user.email }}</span>
        <button class="btn small" (click)="logout()">Cerrar sesión</button>
      </div>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
